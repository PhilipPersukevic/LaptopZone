<!DOCTYPE html>
<html lang="lt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Produktai - LaptopZone</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar">
        <div class="container">
            <div class="logo">
                <h1>💻 LaptopZone</h1>
            </div>
            <div class="nav-links">
                <a href="index.html">Pradžia</a>
                <a href="products.html" class="active">Produktai</a>
                <a href="cart.html" class="cart-link">
                    🛒 Krepšelis <span class="cart-count">0</span>
                </a>
                <a href="login.html" id="nav-auth">Prisijungti</a>
                <a href="#" id="nav-logout" style="display: none;">Atsijungti</a>
            </div>
        </div>
    </nav>

    <!-- Filters and Search -->
    <section class="filters-section">
        <div class="container">
            <div class="section-welcome">
                <h2>🔍 Raskite savą perfectą laptopą</h2>
                <p>Pasirinkite kategorę, užfiltruokite pagal reikalavimus - rąskėme geriausią!</p>
            </div>
            <div class="filters">
                <div class="filter-group">
                    <label>Kategorija:</label>
                    <select id="category-filter">
                        <option value="">Visos kategorijos</option>
                        <option value="gaming">🎮 Gaming</option>
                        <option value="work">💼 Darbui</option>
                        <option value="student">🎓 Studentams</option>
                        <option value="ultrabook">✨ Premium</option>
                    </select>
                </div>
                <div class="filter-group">
                    <label>Gamintojas:</label>
                    <select id="brand-filter">
                        <option value="">Visi gamintojai</option>
                        <option value="Lenovo">Lenovo</option>
                        <option value="ASUS">ASUS</option>
                    </select>
                </div>
                <div class="filter-group">
                    <label>Rūšiavimas:</label>
                    <select id="sort-filter">
                        <option value="name">Pagal pavadinimą</option>
                        <option value="price-low">Kaina: mažiausia</option>
                        <option value="price-high">Kaina: didžiausia</option>
                    </select>
                </div>
                <input type="text" id="search-filter" class="search-input" placeholder="Ieškoti...">
            </div>
        </div>
    </section>

    <!-- Products Grid -->
    <section class="products-section">
        <div class="container">
            <div class="products-grid" id="products-grid">
                <!-- Loaded by JavaScript -->
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer class="footer">
        <div class="container">
            <p>&copy; 2026 LaptopZone. Visos teisės saugomos.</p>
            <p>Specializuota nešiojamų kompiuterių parduotuvė</p>
        </div>
    </footer>

    <script src="js/products.js"></script>
    <script src="js/cart.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
